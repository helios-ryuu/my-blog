services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-blog-dev
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - .:/app:z
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - PORT=3456
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=800
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env
    command: sh -c "pnpm install && pnpm dev"

volumes:
  node_modules:
  next_cache:
