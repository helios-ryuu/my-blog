name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Create Tag & GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Check if GitHub Release already exists for this tag
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists. Skipping."
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

          # Find previous tag for changelog comparison
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)

          # Query merged PR associated with current HEAD commit
          PR_JSON=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" 2>/dev/null || echo "[]")
          PR_TITLE=$(echo "${PR_JSON}" | jq -r '.[0].title // empty')
          PR_BODY=$(echo "${PR_JSON}" | jq -r '.[0].body // empty')

          if [ -z "${PR_TITLE}" ]; then
            PR_TITLE="Release ${TAG}"
          fi

          if [ -z "${PR_BODY}" ]; then
            PR_BODY=$(git log -1 --pretty=%b)
          fi

          if [ -n "${PREV_TAG}" ] && ! echo "${PR_BODY}" | grep -q "Full Changelog:"; then
            PR_BODY="${PR_BODY}"$'\n\n---\n\n'"Full Changelog: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi

          echo "title=${PR_TITLE}" >> "$GITHUB_OUTPUT"
          EOF_MARKER="RELEASE_BODY_$(date +%s)"
          {
            echo "body<<${EOF_MARKER}"
            echo "${PR_BODY}"
            echo "${EOF_MARKER}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.meta.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes "${{ steps.meta.outputs.body }}"
